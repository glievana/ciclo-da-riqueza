<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nossa Grana</title>
<meta name="theme-color" content="#0E2A47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nossa Grana">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --abismo:#0E2A47; --mare:#1F5FA8; --lagoa:#4FA3D9; --raso:#A9D3EF; --espuma:#EAF3FA; --branco:#fff;
  --tinta:#13253A; --tinta2:#5A6E84; --linha:#D6E4F0;
  --ok:#2E9E6B; --risco:#D99A1E; --neg:#D2493F;
  --raio:18px; --raio-s:12px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --num:'Sora',-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--espuma);color:var(--tinta);font:16px/1.45 -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lagoa);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--num);margin:0;letter-spacing:-.02em}
h2{font-size:19px;font-weight:600}
.sub{color:var(--tinta2);font-size:14px}
.pos{color:var(--ok)} .neg{color:var(--neg)} .risco{color:var(--risco)}

/* topo */
.topo{position:sticky;top:0;z-index:5;background:var(--abismo);color:#fff;padding:calc(var(--safe-t) + 10px) 0 10px}
.topo-l{display:flex;align-items:center;justify-content:space-between;padding:0 18px 8px}
.topo h1{font-size:20px;font-weight:700}
.sync svg{width:16px;height:16px}
.sync{font-size:12px;color:var(--raso);display:flex;gap:6px;align-items:center;background:none;border:0;padding:6px 0}
.meses{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.meses::-webkit-scrollbar{display:none}
.mes{flex:0 0 auto;border:1px solid rgba(169,211,239,.35);background:transparent;color:#cfe6f7;border-radius:999px;padding:7px 14px;font-size:14px;scroll-snap-align:center;white-space:nowrap}
.mes[aria-pressed="true"]{background:#fff;color:var(--abismo);border-color:#fff;font-weight:600}
.mes.fut{font-style:italic}

main{padding:16px 16px calc(96px + var(--safe-b));max-width:560px;margin:0 auto}
.tela{display:none}.tela.on{display:block}
.bloco{margin-top:22px}
.bloco-t{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}
.painel{background:var(--branco);border-radius:var(--raio);padding:16px;box-shadow:0 1px 0 var(--linha)}

/* tanque (destaque) */
.tanque{position:relative;overflow:hidden;border-radius:26px;background:var(--abismo);color:#fff;min-height:250px;padding:20px 20px 18px;isolation:isolate}
.agua{position:absolute;left:-10%;right:-10%;bottom:0;height:0;z-index:-1;transition:height 1.4s cubic-bezier(.2,.8,.2,1)}
.agua svg{position:absolute;left:0;top:-22px;width:120%;height:24px;animation:onda 7s linear infinite}
.agua .corpo{position:absolute;inset:0;background:linear-gradient(180deg,var(--lagoa),var(--mare))}
.agua.baixa .corpo{background:linear-gradient(180deg,#E7B04A,#C98612)}
.agua.seca .corpo{background:linear-gradient(180deg,#E06A5F,#B53A31)}
@keyframes onda{from{transform:translateX(0)}to{transform:translateX(-16.6%)}}
@media (prefers-reduced-motion:reduce){.agua{transition:none}.agua svg{animation:none}}
.tanque .rot{font-size:15px;color:#cfe6f7}
.tanque .grande{font-size:44px;font-weight:700;line-height:1.05;margin:6px 0 4px}
.tanque .prev{font-size:14px;color:#cfe6f7}
.selo{color:#fff;display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(255,255,255,.16);backdrop-filter:blur(6px)}
.selo i{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.selo.risco i{background:#F2C14E}.selo.neg i{background:#FF8A80}
.fluxo{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:26px}
.fluxo div{background:rgba(14,42,71,.42);backdrop-filter:blur(6px);border-radius:14px;padding:10px}
.fluxo span{display:block;font-size:12px;color:#cfe6f7}
.fluxo b{font-family:var(--num);font-size:15px;font-weight:600}

.dia{display:flex;gap:14px;align-items:center}
.dia .v{font-size:30px;font-weight:700;line-height:1}
.dia .bolha{flex:0 0 56px;height:56px;border-radius:16px;background:var(--espuma);display:grid;place-items:center;font-family:var(--num);font-weight:700;color:var(--mare);font-size:13px;text-align:center;line-height:1.1}

/* listas */
.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--linha)}
.lista li:first-child{border-top:0}
.lista .t{flex:1;min-width:0}
.lista .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lista .t small{color:var(--tinta2);font-size:13px}
.lista .v{font-family:var(--num);font-weight:600;white-space:nowrap;text-align:right}
.lista .v small{display:block;font-family:inherit;font-weight:400;font-size:12px;color:var(--tinta2)}
.marca{flex:0 0 34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--espuma);color:var(--mare)}
.marca.ok{background:#E3F4EC;color:var(--ok)} .marca.at{background:#FBEDEC;color:var(--neg)}
.marca svg{width:18px;height:18px}

/* barras */
.barra{height:8px;border-radius:99px;background:var(--espuma);overflow:hidden;margin-top:6px}
.barra i{display:block;height:100%;border-radius:99px;background:var(--mare);transition:width .6s}
.barra i.risco{background:var(--risco)}.barra i.neg{background:var(--neg)}.barra i.ok{background:var(--ok)}
.cat{padding:12px 0;border-top:1px solid var(--linha)}
.cat:first-child{border-top:0}
.cat-l{display:flex;justify-content:space-between;gap:10px}
.cat-l b{font-weight:600}
.cat-l .num{font-weight:600}
.cat small{color:var(--tinta2);font-size:13px}

/* cartões */
.cartao{border-radius:22px;padding:18px;color:#fff;position:relative;overflow:hidden;min-height:150px;margin-bottom:12px}
.cartao.inter{background:linear-gradient(135deg,#123A63 0%,#1F5FA8 70%,#2A72C2 100%)}
.cartao.nubank{background:linear-gradient(135deg,#0E2A47 0%,#244B79 60%,#3B6EA8 100%)}
.cartao::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:26px solid rgba(255,255,255,.07)}
.cartao .nome{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.cartao .nome i{width:10px;height:10px;border-radius:3px}
.cartao.inter .nome i{background:#FF8A3D}.cartao.nubank .nome i{background:#A06BE0}
.cartao .valor{font-family:var(--num);font-size:30px;font-weight:700;margin:10px 0 2px}
.cartao .info{font-size:13px;color:#cfe6f7}
.cartao .barra{background:rgba(255,255,255,.2)}
.cartao .barra i{background:#fff}

/* gráficos */
.graf{width:100%;height:auto;display:block}
.graf text{font:11px -apple-system,system-ui,sans-serif;fill:var(--tinta2)}
.leg{display:flex;gap:4px 14px;font-size:13px;color:var(--tinta2);margin-top:8px;flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.marcos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.marcos div{background:var(--branco);border-radius:var(--raio-s);padding:12px}
.marcos span{font-size:13px;color:var(--tinta2)}
.marcos b{display:block;font-family:var(--num);font-size:18px}
.marcos small{color:var(--tinta2);font-size:12px}

/* barra de abas */
.abas{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1px solid var(--linha);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + var(--safe-b))}
.aba{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--tinta2);padding:6px 0}
.aba svg{width:24px;height:24px}
.aba[aria-current="page"]{color:var(--mare);font-weight:600}
.aba.mais{position:relative}
.aba.mais span.bt{width:52px;height:52px;margin-top:-22px;border-radius:18px;background:var(--mare);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(31,95,168,.35)}
.aba.mais span.bt svg{width:26px;height:26px}

/* folha de lançamento */
.veu{position:fixed;inset:0;background:rgba(14,42,71,.45);z-index:9;opacity:0;pointer-events:none;transition:opacity .25s}
.veu.on{opacity:1;pointer-events:auto}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--espuma);border-radius:26px 26px 0 0;max-height:92dvh;overflow:auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:10px 18px calc(20px + var(--safe-b));max-width:560px;margin:0 auto}
.folha.on{transform:none}
.alca{width:40px;height:5px;border-radius:9px;background:var(--linha);margin:0 auto 12px}
.folha h2{margin-bottom:4px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#fff;border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 4px;font-size:14px;color:var(--tinta2)}
.seg button[aria-pressed="true"]{background:var(--mare);color:#fff;font-weight:600}
.campo{margin-top:14px}
.campo label{display:block;font-size:13px;color:var(--tinta2);margin:0 2px 6px}
.campo input,.campo select{width:100%;border:1px solid var(--linha);background:#fff;border-radius:12px;padding:12px;font-size:16px;appearance:none}
.valor-in{font-family:var(--num);font-size:30px!important;font-weight:700;text-align:center;padding:14px!important}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--linha);background:#fff;border-radius:999px;padding:8px 12px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--abismo);border-color:var(--abismo);color:#fff}
.aviso{font-size:13px;color:var(--tinta2);background:#fff;border-radius:12px;padding:10px 12px;margin-top:12px}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font-weight:600;font-size:16px;background:var(--mare);color:#fff;margin-top:18px}
.btn:disabled{opacity:.5}
.btn.claro{background:#fff;color:var(--mare)}
.erro{color:var(--neg);font-size:14px;margin-top:10px;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translate(-50%,20px);background:var(--abismo);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;transition:.25s;z-index:20;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* entrada */
.entrada{min-height:100dvh;background:var(--abismo);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--safe-t) + 30px) 26px calc(var(--safe-b) + 30px)}
.entrada h1{font-size:34px;line-height:1.1}
.entrada p{color:#cfe6f7}
.entrada input{width:100%;border:0;border-radius:14px;padding:15px;font-size:18px;text-align:center;letter-spacing:.08em;text-transform:uppercase;margin-top:18px}
.entrada .btn{background:var(--lagoa);color:var(--abismo)}
.vazio{color:var(--tinta2);font-size:14px;padding:6px 0}
.busca{width:100%;border:1px solid var(--linha);border-radius:12px;padding:11px 12px;background:#fff;font-size:16px;margin-bottom:10px}
.carregando{opacity:.55;transition:opacity .2s}
</style>
</head>
<body>
<div id="raiz"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
// Endereço da API (Apps Script publicado como app da Web)
const LS_K = 'ng_chave', LS_D = 'ng_dados', LS_A = 'ng_api';
(function () { const h = new URLSearchParams(location.hash.slice(1)); if (h.get('api')) localStorage.setItem(LS_A, h.get('api')); if (h.get('k')) localStorage.setItem(LS_K, h.get('k').toUpperCase()); })();
const API = localStorage.getItem(LS_A) || '';

const $ = (s, el = document) => el.querySelector(s);
const brl = (v, dec = true) => (v < 0 ? '−' : '') + 'R$ ' + Math.abs(v).toLocaleString('pt-BR', { minimumFractionDigits: dec ? 2 : 0, maximumFractionDigits: dec ? 2 : 0 });
const brl0 = v => brl(Math.round(v), false);
const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const MESL = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const nomeMes = (k, longo) => { const [a, m] = k.split('-').map(Number); return longo ? MESL[m - 1] : MES[m - 1] + (a !== +estado.d.mesAtual.slice(0, 4) ? '/' + String(a).slice(2) : ''); };
const dataBr = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ico = {
  casa: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  cartao: '<rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6.5 15h4"/>',
  pizza: '<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>',
  futuro: '<path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/>',
  mais: '<path d="M12 5v14M5 12h14"/>',
  ok: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  relogio: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  sync: '<path d="M20 11a8 8 0 0 0-14.5-4.5M4 13a8 8 0 0 0 14.5 4.5"/><path d="M5 3v4h4M19 21v-4h-4"/>',
};
const svg = (n, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ico[n]}</svg>`;

const estado = { d: null, mes: null, tela: 'inicio', busca: '' };

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); }

// ---------------- dados
function chave() { return localStorage.getItem(LS_K) || ''; }
async function buscar() {
  if (location.search.includes('demo')) return (await (await fetch('demo.json')).json()).dados;
  const r = await fetch(API + '?k=' + encodeURIComponent(chave()) + '&t=' + Date.now(), { redirect: 'follow' });
  const j = await r.json();
  if (!j.ok) throw new Error(j.erro === 'chave' ? 'chave' : j.erro || 'Falha ao ler a planilha');
  return j.dados;
}
async function carregar(manual) {
  const m = $('main'); if (m) m.classList.add('carregando');
  try {
    const d = await buscar();
    estado.d = d; localStorage.setItem(LS_D, JSON.stringify(d));
    if (!estado.mes || !d.meses.some(x => x.mes === estado.mes)) estado.mes = d.mesAtual;
    render(); if (manual) toast('Atualizado com a planilha');
  } catch (e) {
    if (e.message === 'chave') { localStorage.removeItem(LS_K); entrada('Essa chave não abriu a planilha. Confira em Pluggy › célula E10.'); return; }
    if (estado.d) { render(); toast('Sem conexão: mostrando os últimos dados'); }
    else entrada('Não deu para falar com a planilha agora. Verifique a internet e tente de novo.');
  } finally { const m2 = $('main'); if (m2) m2.classList.remove('carregando'); }
}

// ---------------- tela de entrada (chave)
function entrada(msg) {
  $('#raiz').innerHTML = `<section class="entrada">
    <h1>Nossa Grana</h1>
    <p>O painel das finanças de vocês dois, ligado à planilha. Para abrir, digite a chave de acesso que está na aba Pluggy da planilha, célula E10.</p>
    <form id="fk"><label class="sub" for="k" style="color:#cfe6f7">Chave de acesso</label>
    <input id="k" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX-XXXX" required>
    <button class="btn" type="submit">Abrir</button><p class="erro" style="color:#FFB4AC">${msg ? esc(msg) : ''}</p></form></section>`;
  $('#fk').onsubmit = e => { e.preventDefault(); localStorage.setItem(LS_K, $('#k').value.trim().toUpperCase()); montar(); carregar(); };
}

// ---------------- estrutura
function montar() {
  $('#raiz').innerHTML = `
  <header class="topo"><div class="topo-l"><h1>Nossa Grana</h1>
    <button class="sync" id="sync" aria-label="Atualizar dados">${svg('sync')}<span id="synct"></span></button></div>
    <nav class="meses" id="meses" aria-label="Escolher mês"></nav></header>
  <main id="main"></main>
  <nav class="abas" aria-label="Seções">
    <button class="aba" data-t="inicio">${svg('casa')}Início</button>
    <button class="aba" data-t="cartoes">${svg('cartao')}Cartões</button>
    <button class="aba mais" id="bmais" aria-label="Lançar receita ou despesa"><span class="bt">${svg('mais', 2.4)}</span></button>
    <button class="aba" data-t="gastos">${svg('pizza')}Gastos</button>
    <button class="aba" data-t="futuro">${svg('futuro')}Futuro</button>
  </nav>
  <div class="veu" id="veu"></div><section class="folha" id="folha" role="dialog" aria-modal="true" aria-label="Novo lançamento"></section>`;
  document.querySelectorAll('.aba[data-t]').forEach(b => b.onclick = () => { estado.tela = b.dataset.t; render(); scrollTo(0, 0); });
  $('#bmais').onclick = abrirLanc; $('#veu').onclick = fecharLanc; $('#sync').onclick = () => carregar(true);
}

function render() {
  const d = estado.d; if (!d) return;
  if (!$('#main')) montar();
  $('#synct').textContent = 'planilha às ' + d.geradoEm.slice(11, 16);
  $('#meses').innerHTML = d.meses.map(m => `<button class="mes ${m.mes > d.mesAtual ? 'fut' : ''}" aria-pressed="${m.mes === estado.mes}" data-m="${m.mes}">${nomeMes(m.mes)}</button>`).join('');
  $('#meses').querySelectorAll('.mes').forEach(b => b.onclick = () => { estado.mes = b.dataset.m; render(); });
  const at = $('#meses [aria-pressed="true"]'); if (at) at.scrollIntoView({ inline: 'center', block: 'nearest' });
  document.querySelectorAll('.aba[data-t]').forEach(b => b.dataset.t === estado.tela ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  const telas = { inicio: telaInicio, cartoes: telaCartoes, gastos: telaGastos, futuro: telaFuturo };
  $('#main').innerHTML = telas[estado.tela]();
  if (estado.tela === 'inicio') requestAnimationFrame(() => requestAnimationFrame(() => { const a = $('.agua'); if (a) a.style.height = a.dataset.h + '%'; }));
  if (estado.tela === 'gastos') { const b = $('#busca'); if (b) b.oninput = () => { estado.busca = b.value; $('#lancs').innerHTML = listaLanc(); }; }
}

// ---------------- regras (iguais às da planilha)
function mesDados(k) { return estado.d.meses.find(m => m.mes === k); }
function status(m) {
  const min = estado.d.invest.aporteMin;
  if (!m.rec && !m.desp) return { c: 'risco', t: 'Sem lançamentos neste mês' };
  if (m.sobra < 0) return { c: 'neg', t: 'Negativo: gastaram mais do que entrou' };
  if (m.aporte < min || (m.rec > 0 && m.desp / m.rec > 0.9)) return { c: 'risco', t: 'Em risco: sobra ou aporte abaixo da meta' };
  return { c: 'ok', t: 'Saudável: a renda cobre gastos e aporte' };
}
function porDia() {
  const d = estado.d, m = mesDados(d.mesAtual); if (!m || !m.recPrev) return null;
  const [a, mm] = d.mesAtual.split('-').map(Number);
  const hoje = +d.geradoEm.slice(8, 10), fim = new Date(a, mm, 0).getDate(), dias = fim - hoje + 1;
  const livre = m.recPrev - d.invest.aporteMin - m.desp;
  const v = livre / dias, ritmo = (m.recPrev - d.invest.aporteMin) / fim / 2;
  return { v, dias, livre, c: v < 0 ? 'neg' : v < ritmo ? 'risco' : 'ok', t: v < 0 ? 'Já passou do que a renda permite neste mês' : v < ritmo ? 'Ritmo apertado: segurem os gastos' : 'Dentro do ritmo' };
}

// ---------------- INÍCIO
function telaInicio() {
  const d = estado.d, k = estado.mes, m = mesDados(k), fut = k > d.mesAtual, st = status(m);
  const nivel = m.rec > 0 ? Math.max(6, Math.min(88, (m.sobra / m.rec) * 100 * 1.6 + 8)) : 6;
  const tom = st.c === 'neg' ? 'seca' : st.c === 'risco' ? 'baixa' : '';
  const pd = k === d.mesAtual ? porDia() : null;
  const fx = (d.fixas[k] || []);
  const totFix = fx.reduce((s, f) => s + (f.pago || f.previsto), 0);
  const cm = d.cartoes.meses.find(c => c.mes === k) || { inter: 0, nubank: 0 };
  return `
  <section class="tanque" aria-label="Resumo do mês">
    <div class="agua ${tom}" data-h="${nivel.toFixed(0)}"><svg viewBox="0 0 1200 24" preserveAspectRatio="none"><path fill="${tom === 'seca' ? '#E06A5F' : tom === 'baixa' ? '#E7B04A' : '#4FA3D9'}" d="M0 12 Q50 0 100 12 T200 12 T300 12 T400 12 T500 12 T600 12 T700 12 T800 12 T900 12 T1000 12 T1100 12 T1200 12 V24 H0z"/></svg><div class="corpo"></div></div>
    <div class="rot">${fut ? 'Sobra prevista em ' : 'O que sobra em '}${nomeMes(k, true)}</div>
    <div class="grande num">${brl(m.sobra)}</div>
    <div class="prev">${fut ? 'Previsão com renda, parcelas, contas fixas e aporte mínimo' : 'Previsto: ' + brl(m.sobraPrev)}</div>
    <div class="selo ${st.c}"><i></i>${st.t}</div>
    <div class="fluxo">
      <div><span>Entra</span><b>${brl0(m.rec)}</b></div>
      <div><span>Sai</span><b>${brl0(m.desp)}</b></div>
      <div><span>Investe</span><b>${brl0(m.aporte)}</b></div>
    </div>
  </section>

  ${pd ? `<div class="bloco painel"><div class="dia"><div class="bolha">${pd.dias}<br>dias</div>
    <div><div class="sub">Dá para gastar por dia até o fim do mês</div>
    <div class="v num ${pd.c === 'ok' ? '' : pd.c}">${brl(pd.v)}</div>
    <div class="sub ${pd.c}">${pd.t}</div></div></div></div>` : ''}

  <div class="bloco"><div class="bloco-t"><h2>Faturas que vencem</h2><span class="sub num">${brl(cm.inter + cm.nubank)}</span></div>
    <div class="painel"><ul class="lista">
      ${linhaFatura('Inter', cm.inter, d.cartoes.venc.inter, d.cartoes.limites.inter, k)}
      ${linhaFatura('Nubank', cm.nubank, d.cartoes.venc.nubank, d.cartoes.limites.nubank, k)}
    </ul></div></div>

  <div class="bloco"><div class="bloco-t"><h2>Contas fixas</h2><span class="sub num">${brl(totFix)}</span></div>
    <div class="painel"><ul class="lista">${fx.map(f => {
      const pago = f.pago > 0, atras = !pago && k === d.mesAtual && f.dia && +d.geradoEm.slice(8, 10) > f.dia;
      return `<li><span class="marca ${pago ? 'ok' : atras ? 'at' : ''}">${svg(pago ? 'ok' : 'relogio')}</span>
        <span class="t"><b>${esc(f.nome)}</b><small>${pago ? 'Pago em ' + dataBr(f.dataPgto) : atras ? 'Ainda não apareceu no banco · dia ' + f.dia : f.dia ? 'Vence por volta do dia ' + f.dia : 'Recarga quando precisar'}</small></span>
        <span class="v">${brl(pago ? f.pago : f.previsto)}${pago ? '' : '<small>previsto</small>'}</span></li>`;
    }).join('')}</ul></div></div>`;
}
function linhaFatura(nome, v, venc, lim, k) {
  const pct = lim ? v / lim * 100 : 0, c = pct >= 90 ? 'neg' : pct >= 70 ? 'risco' : 'ok';
  return `<li><span class="marca">${svg('cartao')}</span><span class="t"><b>${nome}</b><small>Vence dia ${venc} de ${nomeMes(k, true)} · ${pct.toFixed(0)}% do limite</small>
    <div class="barra"><i class="${c}" style="width:${Math.min(100, pct)}%"></i></div></span><span class="v">${brl(v)}</span></li>`;
}

// ---------------- CARTÕES
function telaCartoes() {
  const d = estado.d, k = estado.mes, c = d.cartoes, cm = c.meses.find(x => x.mes === k) || {};
  const cartao = (cls, nome, v, lanc, lim, venc, fech) => {
    const pct = lim ? v / lim * 100 : 0;
    return `<div class="cartao ${cls}"><div class="nome"><i></i>${nome}</div>
      <div class="valor">${brl(v)}</div>
      <div class="info">${lanc ? 'Fatura de ' + nomeMes(k, true) : 'Só parcelas já assumidas (fatura ainda não fechou)'} · vence dia ${venc}</div>
      <div class="barra"><i style="width:${Math.min(100, pct)}%"></i></div>
      <div class="info" style="margin-top:6px">${pct.toFixed(1).replace('.', ',')}% de ${brl0(lim)} de limite · fecha dia ${fech}</div></div>`;
  };
  const max = Math.max(...c.meses.map(x => x.total), 1);
  const W = 340, H = 150, bw = W / c.meses.length;
  const barras = c.meses.map((x, i) => {
    const hi = x.inter / max * (H - 24), hn = x.nubank / max * (H - 24), xx = i * bw + bw * .18, w = bw * .64;
    return `<g opacity="${x.mes === k ? 1 : .55}"><rect x="${xx}" y="${H - 18 - hi}" width="${w}" height="${hi}" rx="3" fill="#1F5FA8"/>
      <rect x="${xx}" y="${H - 18 - hi - hn}" width="${w}" height="${hn}" rx="3" fill="#A9D3EF"/>
      <text x="${xx + w / 2}" y="${H - 4}" text-anchor="middle">${nomeMes(x.mes).slice(0, 3)}</text></g>`;
  }).join('');
  const par = d.parcelas.slice().sort((a, b) => b.valor * b.restantes - a.valor * a.restantes);
  return `${cartao('inter', 'Inter', cm.inter || 0, cm.interLanc, c.limites.inter, c.venc.inter, c.fech.inter)}
    ${cartao('nubank', 'Nubank', cm.nubank || 0, cm.nuLanc, c.limites.nubank, c.venc.nubank, c.fech.nubank)}
    <div class="bloco"><div class="bloco-t"><h2>Faturas nos próximos meses</h2></div>
    <div class="painel"><svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturas por mês">${barras}</svg>
    <div class="leg"><span><i style="background:#1F5FA8"></i>Inter</span><span><i style="background:#A9D3EF"></i>Nubank</span></div></div></div>
    <div class="bloco"><div class="bloco-t"><h2>Parcelas em aberto</h2><span class="sub">livres em ${d.livresEm ? nomeMes(d.livresEm, true) + '/' + d.livresEm.slice(0, 4) : '—'}</span></div>
    <div class="painel"><ul class="lista">${par.map(p => `<li><span class="t"><b>${esc(p.desc)}</b><small>${p.cartao.replace('Cartão ', '')} · faltam ${p.restantes} · última em ${p.ultima ? nomeMes(p.ultima) : '—'}</small></span>
      <span class="v">${brl(p.valor)}<small>${brl0(p.valor * p.restantes)} no total</small></span></li>`).join('') || '<li class="vazio">Nenhuma parcela em aberto.</li>'}</ul></div></div>`;
}

// ---------------- GASTOS
function telaGastos() {
  const d = estado.d, k = estado.mes, g = d.gastos[k] || {}, o = d.orc[k] || {};
  const cats = Array.from(new Set([...d.listas.despesa, ...Object.keys(g)])).map(c => ({ c, v: g[c] || 0, p: o[c] || 0 }))
    .filter(x => x.v || x.p).sort((a, b) => b.v - a.v);
  const tot = cats.reduce((s, x) => s + x.v, 0), maxv = Math.max(...cats.map(x => Math.max(x.v, x.p)), 1);
  return `<div class="bloco-t" style="margin-top:4px"><h2>Para onde foi o dinheiro</h2><span class="sub num">${brl(tot)}</span></div>
    <div class="painel">${cats.map(x => {
      const pct = x.p ? x.v / x.p * 100 : 0, cl = !x.p ? '' : pct > 100 ? 'neg' : pct > 85 ? 'risco' : 'ok';
      return `<div class="cat"><div class="cat-l"><b>${esc(x.c)}</b><span class="num">${brl(x.v)}</span></div>
        <div class="barra"><i class="${cl}" style="width:${(x.p ? Math.min(100, pct) : x.v / maxv * 100).toFixed(1)}%"></i></div>
        <small>${x.p ? `${pct.toFixed(0)}% de ${brl0(x.p)} previstos` : (tot ? (x.v / tot * 100).toFixed(0) + '% dos gastos' : '')}</small></div>`;
    }).join('') || '<p class="vazio">Nada lançado neste mês ainda.</p>'}</div>
    <p class="sub" style="margin:8px 4px 0">Compras no cartão contam no mês da fatura.</p>
    <div class="bloco"><div class="bloco-t"><h2>Últimos lançamentos</h2></div>
    <input class="busca" id="busca" type="search" placeholder="Buscar por nome ou categoria" value="${esc(estado.busca)}" aria-label="Buscar lançamentos">
    <div class="painel"><ul class="lista" id="lancs">${listaLanc()}</ul></div></div>`;
}
function listaLanc() {
  const q = estado.busca.trim().toLowerCase();
  const l = estado.d.recentes.filter(x => !q || (x.desc + ' ' + x.cat + ' ' + x.forma).toLowerCase().includes(q)).slice(0, 50);
  return l.map(x => `<li><span class="t"><b>${esc(x.desc)}</b><small>${dataBr(x.data)} · ${esc(x.cat)} · ${esc(x.forma.replace('Cartão ', ''))}${x.parcela ? ' · ' + esc(x.parcela) : ''}</small></span>
    <span class="v ${x.tipo === 'Receita' ? 'pos' : ''}">${x.tipo === 'Despesa' ? '' : '+'}${brl(x.valor)}</span></li>`).join('') || '<li class="vazio">Nenhum lançamento encontrado.</li>';
}

// ---------------- FUTURO
function telaFuturo() {
  const d = estado.d, ms = d.meses, W = 340, H = 170, bw = W / ms.length;
  const vals = ms.map(m => m.sobra), mx = Math.max(...vals.map(Math.abs), 1), zero = H * .62;
  const esc1 = (zero - 14) / mx;
  const barras = ms.map((m, i) => {
    const h = Math.abs(m.sobra) * esc1, x = i * bw + bw * .2, w = bw * .6, y = m.sobra >= 0 ? zero - h : zero;
    return `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h, 1)}" rx="3" fill="${m.sobra < 0 ? '#D2493F' : m.mes > d.mesAtual ? '#A9D3EF' : '#1F5FA8'}"/>
      <text x="${x + w / 2}" y="${H - 4}" text-anchor="middle">${nomeMes(m.mes).slice(0, 3)}</text>`;
  }).join('');
  const acum = ms.reduce((s, m) => s + m.sobra, 0);
  const pj = d.invest.projecao, pmax = Math.max(...pj.map(p => p.max), 1), PH = 160;
  const pt = (k) => pj.map((p, i) => `${(i / (pj.length - 1) * W).toFixed(1)},${(PH - 18 - p[k] / pmax * (PH - 30)).toFixed(1)}`).join(' ');
  const area = `0,${PH - 18} ${pt('max')} ${W},${PH - 18}`;
  return `<div class="bloco-t" style="margin-top:4px"><h2>Sobra mês a mês</h2><span class="sub num">${brl0(acum)} em 12 meses</span></div>
    <div class="painel"><svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sobra prevista por mês">
      <line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="#D6E4F0"/>${barras}</svg>
      <div class="leg"><span><i style="background:#1F5FA8"></i>Realizado</span><span><i style="background:#A9D3EF"></i>Previsão</span><span><i style="background:#D2493F"></i>Negativo</span></div></div>

    <div class="bloco"><div class="bloco-t"><h2>Investimentos</h2><span class="sub">hoje ${brl0(d.invest.investidoHoje)}</span></div>
    <div class="painel"><svg class="graf" viewBox="0 0 ${W} ${PH}" role="img" aria-label="Projeção dos investimentos">
      <polygon points="${area}" fill="#EAF3FA"/>
      <polyline points="${pt('max')}" fill="none" stroke="#4FA3D9" stroke-width="2.5"/>
      <polyline points="${pt('min')}" fill="none" stroke="#1F5FA8" stroke-width="2.5"/>
      <text x="0" y="${PH - 2}">${nomeMes(pj[0].mes)}</text><text x="${W}" y="${PH - 2}" text-anchor="end">${nomeMes(pj[pj.length - 1].mes)}</text></svg>
      <div class="leg"><span><i style="background:#1F5FA8"></i>Aportando ${brl0(d.invest.aporteMin)}/mês</span><span><i style="background:#4FA3D9"></i>Aportando ${brl0(d.invest.aporteMax)}/mês</span></div></div>
    <div class="marcos" style="margin-top:10px">${d.invest.marcos.map(x => `<div><span>Em ${esc(x.prazo)}</span><b>${brl0(x.saldoMin)}</b><small>até ${brl0(x.saldoMax)} com ${brl0(d.invest.aporteMax)}/mês</small></div>`).join('')}</div>
    <p class="sub" style="margin:10px 4px 0">Estimativa com ${(d.invest.cdi * 100).toFixed(2).replace('.', ',')}% de CDI ao ano e ${(d.invest.pctCdi * 100).toFixed(0)}% do CDI. Não é promessa de rendimento.</p></div>`;
}

// ---------------- LANÇAR
const novo = { tipo: 'Despesa', cat: '', forma: 'Pix/Conta', resp: 'Ele' };
function abrirLanc() {
  const d = estado.d; if (!d) return;
  const hoje = d.geradoEm.slice(0, 10);
  const cats = novo.tipo === 'Receita' ? d.listas.receita : d.listas.despesa;
  if (!cats.includes(novo.cat)) novo.cat = '';
  const formas = d.listas.formas.filter(f => !/^Cartão/.test(f));
  const seg = (nome, ops, val) => `<div class="seg" role="group" aria-label="${nome}">${ops.map(o => `<button type="button" data-g="${nome}" data-v="${esc(o)}" aria-pressed="${o === val}">${esc(o)}</button>`).join('')}</div>`;
  $('#folha').innerHTML = `<div class="alca"></div><h2>Novo lançamento</h2>
    <form id="fl">${seg('tipo', ['Despesa', 'Receita'], novo.tipo)}
    <div class="campo"><label for="lv">Valor</label><input id="lv" class="valor-in" inputmode="decimal" placeholder="R$ 0,00" required></div>
    <div class="campo"><label for="ld">Descrição</label><input id="ld" maxlength="120" placeholder="${novo.tipo === 'Receita' ? 'Ex.: salário, freela' : 'Ex.: feira, farmácia, gás'}" required></div>
    <div class="campo"><label>Categoria</label><div class="chips" role="group" aria-label="Categoria">${cats.map(c => `<button type="button" data-g="cat" data-v="${esc(c)}" aria-pressed="${c === novo.cat}">${esc(c)}</button>`).join('')}</div></div>
    <div class="campo"><label>Quem</label>${seg('resp', d.listas.resp, novo.resp)}</div>
    <div class="campo"><label for="lf">Como foi pago</label><select id="lf">${formas.map(f => `<option ${f === novo.forma ? 'selected' : ''}>${esc(f)}</option>`).join('')}</select></div>
    <div class="campo"><label for="lt">Data</label><input id="lt" type="date" value="${hoje}" required></div>
    <p class="aviso">Cartões Inter e Nubank e a conta da Adna entram sozinhos pela Pluggy todo dia. Lance aqui o que vier da conta do Gabriel, dinheiro e receitas.</p>
    <p class="erro" id="le"></p>
    <button class="btn" id="lb" type="submit">Salvar na planilha</button>
    <button class="btn claro" type="button" id="lc">Cancelar</button></form>`;
  $('#folha').querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
    const g = b.dataset.g; novo[g] = b.dataset.v;
    if (g === 'tipo') { abrirLanc(); return; }
    b.parentElement.querySelectorAll('[data-g]').forEach(x => x.setAttribute('aria-pressed', x === b));
  });
  $('#lv').oninput = e => { const n = e.target.value.replace(/\D/g, ''); e.target.value = n ? brl(+n / 100) : ''; };
  $('#lc').onclick = fecharLanc;
  $('#fl').onsubmit = salvarLanc;
  $('#veu').classList.add('on'); $('#folha').classList.add('on');
}
function fecharLanc() { $('#veu').classList.remove('on'); $('#folha').classList.remove('on'); }
async function salvarLanc(e) {
  e.preventDefault();
  const valor = +($('#lv').value.replace(/\D/g, '')) / 100, err = $('#le');
  if (!(valor > 0)) { err.textContent = 'Informe o valor.'; return; }
  if (!novo.cat) { err.textContent = 'Escolha a categoria.'; return; }
  const l = { tipo: novo.tipo, valor, desc: $('#ld').value.trim(), cat: novo.cat, resp: novo.resp, forma: $('#lf').value, data: $('#lt').value };
  novo.forma = l.forma;
  if (location.search.includes('demo')) { fecharLanc(); toast('Salvo na planilha (demonstração)'); return; }
  const b = $('#lb'); b.disabled = true; b.textContent = 'Salvando…'; err.textContent = '';
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ k: chave(), acao: 'lancar', l }) });
    const j = await r.json(); if (!j.ok) throw new Error(j.erro);
    fecharLanc(); toast('Salvo na planilha'); carregar();
  } catch (x) { err.textContent = 'Não salvou: ' + (x.message || 'sem conexão') + '. Tente de novo.'; b.disabled = false; b.textContent = 'Salvar na planilha'; }
}

// ---------------- início
(function iniciar() {
  try { estado.d = JSON.parse(localStorage.getItem(LS_D) || 'null'); } catch (x) { estado.d = null; }
  if ((!chave() || !API) && !location.search.includes('demo')) { entrada(API ? '' : 'Abra pelo link de instalação que veio com a chave para conectar o app à planilha.'); return; }
  if (estado.d) { estado.mes = estado.d.mesAtual; montar(); render(); }
  carregar();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
