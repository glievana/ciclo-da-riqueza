<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ciclo da Riqueza</title>
<meta name="theme-color" content="#0D0C0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ciclo da Riqueza">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&display=swap" rel="stylesheet">
<style>
:root{
  /* identidade do Ciclo da Riqueza */
  --carvao:#0D0C0B; --grafite:#191613; --grafite2:#24201B; --linha:#34302A;
  --ouro:#E4A73C; --ouro2:#F2CF86; --rubi:#D04A3F; --rubi2:#F08A7E; --cinza:#9A9187; --marfim:#F3EDE3;
  /* semáforo dos números (só para status) */
  --ok:#4FB37A; --risco:#F2C94C; --neg:#E5534B;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --tit:'Archivo',-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--carvao);color:var(--marfim);font:16px/1.45 -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
.num{font-family:var(--tit);font-variant-numeric:tabular-nums}
h1,h2{font-family:var(--tit);margin:0;font-stretch:85%;letter-spacing:-.01em}
h2{font-size:20px;font-weight:700}
.sub{color:var(--cinza);font-size:14px}
.ok{color:var(--ok)}.risco{color:var(--risco)}.neg{color:var(--neg)}

.topo{position:sticky;top:0;z-index:5;background:linear-gradient(var(--carvao) 82%,rgba(13,12,11,0));padding:calc(var(--safe-t) + 10px) 0 8px}
.topo-l{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px 10px}
.topo h1{font-size:22px;font-weight:800;color:var(--ouro);line-height:1.1}
.topo .ola{font-size:12.5px;color:var(--cinza)}
.acoes{display:flex;gap:6px}
.pilula{display:flex;align-items:center;gap:6px;border:1px solid var(--linha);background:var(--grafite);border-radius:999px;padding:7px 11px;font-size:13px;color:var(--marfim)}
.pilula svg{width:17px;height:17px}
.pilula[aria-pressed="true"]{border-color:var(--ouro);color:var(--ouro)}
.periodos{display:flex;gap:8px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.periodos::-webkit-scrollbar{display:none}
.per{flex:0 0 auto;border:1px solid var(--linha);background:transparent;color:var(--cinza);border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap}
.per.fut{font-style:italic}
.per[aria-pressed="true"]{background:var(--ouro);border-color:var(--ouro);color:var(--carvao);font-weight:700}
.per.ano{color:var(--ouro);border-color:rgba(228,167,60,.5)}
.per.ano[aria-pressed="true"]{color:var(--carvao)}

main{padding:4px 14px calc(100px + var(--safe-b));max-width:520px;margin:0 auto}
.cartao{background:var(--grafite);border:1px solid var(--linha);border-radius:18px;padding:16px;margin-top:14px}
.bloco-t{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 0}
.aviso{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.aviso b{color:var(--ouro)}
.aviso.alerta{border-color:rgba(229,83,75,.55)} .aviso.alerta b{color:var(--rubi2)}
.aviso .ic{flex:0 0 22px;height:22px;color:var(--ouro)} .aviso.alerta .ic{color:var(--rubi2)}
.nota{font-size:12.5px;color:var(--cinza);margin:12px 4px 0}

/* status (semáforo sempre com ícone + texto) */
.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;border:1px solid currentColor}
.status svg{width:15px;height:15px}
.status.ok{color:var(--ok);background:rgba(79,179,122,.1)} .status.risco{color:var(--risco);background:rgba(242,201,76,.1)} .status.neg{color:var(--neg);background:rgba(229,83,75,.1)}

/* diagrama */
.diagrama{display:block;width:100%;height:auto}
.diagrama .tt{font:800 14px var(--tit);font-stretch:85%;letter-spacing:.02em}
.diagrama .st{font:11.5px -apple-system,system-ui,sans-serif}
.diagrama .pv{font:800 22px var(--tit);font-variant-numeric:tabular-nums}
.loop{fill:none;stroke-linecap:round;stroke-linejoin:round}
.desenha{stroke-dasharray:1400;stroke-dashoffset:1400;animation:desenha 1.6s .2s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes desenha{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.desenha{animation:none;stroke-dashoffset:0}}
.legenda{display:flex;gap:10px;margin-top:6px;font-size:13px}
.legenda div{flex:1;border-radius:12px;padding:10px 12px;background:var(--grafite)}
.legenda .r{border:1px solid rgba(228,167,60,.45)} .legenda .c{border:1px solid rgba(208,74,63,.5);text-align:right}
.legenda b{display:block;font-family:var(--tit);font-size:22px;font-weight:800}
.legenda .r b{color:var(--ouro)} .legenda .c b{color:var(--rubi2)}
.legenda span{color:var(--cinza)}

/* atalho do resumo do mês */
.atalho{display:block;width:100%;text-align:left;background:linear-gradient(135deg,#1E1A15,#191613);border:1px solid rgba(228,167,60,.35);border-radius:20px;padding:16px;margin-top:14px;color:var(--marfim)}
.atalho .lin{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.atalho .grande{font-family:var(--tit);font-size:32px;font-weight:800;line-height:1.05;margin:4px 0 6px}
.atalho .seta{color:var(--ouro);font-size:14px;font-weight:600;white-space:nowrap}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.trio div{background:var(--grafite2);border-radius:12px;padding:9px 10px}
.trio span{display:block;font-size:12px;color:var(--cinza)} .trio b{font-family:var(--tit);font-size:15px}

.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.grade div{background:var(--grafite);border:1px solid var(--linha);border-radius:14px;padding:12px}
.grade span{font-size:13px;color:var(--cinza)}
.grade b{display:block;font-family:var(--tit);font-size:24px;font-weight:800;line-height:1.15}
.grade small{color:var(--cinza);font-size:12px}

/* listas */
.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--linha)}
.lista li:first-child{border-top:0}
.lista .t{flex:1;min-width:0}
.lista .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lista .t small{color:var(--cinza);font-size:13px}
.lista .v{font-family:var(--tit);font-weight:700;white-space:nowrap;text-align:right}
.lista .v small{display:block;font-family:inherit;font-weight:400;font-size:12px;color:var(--cinza)}
.marca{flex:0 0 34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--grafite2);color:var(--cinza)}
.marca.ok{background:rgba(79,179,122,.14);color:var(--ok)} .marca.neg{background:rgba(229,83,75,.14);color:var(--neg)} .marca.risco{background:rgba(242,201,76,.14);color:var(--risco)}
.marca svg{width:18px;height:18px}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px;border:1px solid var(--linha);color:var(--cinza)}
.tag.ouro{color:var(--ouro);border-color:rgba(228,167,60,.5)} .tag.rubi{color:var(--rubi2);border-color:rgba(208,74,63,.5)}
.barra{height:8px;border-radius:99px;background:var(--grafite2);overflow:hidden;margin-top:6px;position:relative}
.barra i{display:block;height:100%;border-radius:99px;background:var(--ouro);transition:width .6s}
.barra i.ok{background:var(--ok)} .barra i.risco{background:var(--risco)} .barra i.neg{background:var(--neg)}
.cat{padding:12px 0;border-top:1px solid var(--linha)} .cat:first-child{border-top:0}
.cat-l{display:flex;justify-content:space-between;gap:10px} .cat-l b{font-weight:600} .cat-l .num{font-weight:700;white-space:nowrap}
.cat small{color:var(--cinza);font-size:13px}
.busca{width:100%;border:1px solid var(--linha);border-radius:12px;padding:11px 12px;background:var(--grafite);font-size:16px;margin:10px 0}

/* cartões */
.cc{border-radius:22px;padding:18px;position:relative;overflow:hidden;min-height:150px;margin-top:12px;border:1px solid var(--linha);background:linear-gradient(140deg,#24201B,#141210)}
.cc::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;border:24px solid rgba(228,167,60,.07)}
.cc .nome{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.cc .nome i{width:10px;height:10px;border-radius:3px}
.cc.inter .nome i{background:#FF8A3D} .cc.nubank .nome i{background:#A06BE0}
.cc .valor{font-family:var(--tit);font-size:30px;font-weight:800;margin:10px 0 2px}
.cc .info{font-size:13px;color:var(--cinza)}

/* desafio */
.destaque{display:flex;align-items:center;gap:16px}
.anel{flex:0 0 112px}
.destaque .grande{font-family:var(--tit);font-size:40px;font-weight:800;line-height:1}
.selos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.selo{border-radius:14px;padding:14px 8px;text-align:center;border:1px dashed var(--linha);color:var(--cinza)}
.selo b{display:block;font-family:var(--tit);font-size:26px;font-weight:800}
.selo.ganho{border:1px solid var(--ouro);color:var(--ouro);background:rgba(228,167,60,.08)}
.graf{display:block;width:100%;height:auto}
.graf text{font:11px -apple-system,system-ui,sans-serif;fill:var(--cinza)}
.leg{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:var(--cinza);margin-top:8px}
.leg i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:6px;vertical-align:3px}
.metas{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.metas button{border:1px solid var(--linha);background:var(--grafite2);border-radius:999px;padding:8px 14px;font-size:14px}
.metas button[aria-pressed="true"]{border-color:var(--ouro);color:var(--ouro)}
.marcos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.marcos div{background:var(--grafite2);border-radius:12px;padding:12px}
.marcos span{font-size:13px;color:var(--cinza)} .marcos b{display:block;font-family:var(--tit);font-size:19px;color:var(--ouro)} .marcos small{color:var(--cinza);font-size:12px}

/* barra de abas */
.abas{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(13,12,11,.94);backdrop-filter:blur(14px);border-top:1px solid var(--linha);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(8px + var(--safe-b))}
.aba{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--cinza);padding:6px 0}
.aba svg{width:24px;height:24px}
.aba[aria-current="page"]{color:var(--ouro);font-weight:600}
.aba.mais .bt{width:54px;height:54px;margin-top:-24px;border-radius:18px;background:var(--ouro);color:var(--carvao);display:grid;place-items:center;box-shadow:0 8px 22px rgba(228,167,60,.3)}
.aba.mais .bt svg{width:28px;height:28px}

/* folha de lançamento */
.veu{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9;opacity:0;pointer-events:none;transition:opacity .25s}
.veu.on{opacity:1;pointer-events:auto}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--grafite);border-top:1px solid var(--linha);border-radius:26px 26px 0 0;max-height:92dvh;overflow:auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:10px 18px calc(20px + var(--safe-b));max-width:560px;margin:0 auto}
.folha.on{transform:none}
.alca{width:40px;height:5px;border-radius:9px;background:var(--linha);margin:0 auto 12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--carvao);border-radius:12px;padding:4px;gap:4px;border:1px solid var(--linha)}
.seg button{border:0;background:none;border-radius:9px;padding:9px 4px;font-size:14px;color:var(--cinza)}
.seg button[aria-pressed="true"]{background:var(--ouro);color:var(--carvao);font-weight:700}
.campo{margin-top:14px}
.campo label{display:block;font-size:13px;color:var(--cinza);margin:0 2px 6px}
.campo input,.campo select{width:100%;border:1px solid var(--linha);background:var(--carvao);border-radius:12px;padding:12px;font-size:16px;appearance:none}
.valor-in{font-family:var(--tit);font-size:30px!important;font-weight:800;text-align:center;padding:14px!important}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--linha);background:var(--carvao);border-radius:999px;padding:8px 12px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--marfim);border-color:var(--marfim);color:var(--carvao);font-weight:600}
.chips.ciclo button[data-v="Investimento"][aria-pressed="true"],.chips.ciclo button[data-v="Alavancagem"][aria-pressed="true"],.chips.ciclo button[data-v="Receita"][aria-pressed="true"]{background:var(--ouro);border-color:var(--ouro)}
.chips.ciclo button[data-v="Eu mereço"][aria-pressed="true"]{background:var(--rubi);border-color:var(--rubi);color:#fff}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:16px;background:var(--ouro);color:var(--carvao);margin-top:18px}
.btn:disabled{opacity:.5}
.btn.claro{background:transparent;color:var(--marfim);border:1px solid var(--linha);margin-top:10px}
.erro{color:var(--rubi2);font-size:14px;margin-top:10px;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,20px);background:var(--marfim);color:var(--carvao);padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;transition:.25s;z-index:20;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* login */
.entrada{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--safe-t) + 30px) 26px calc(var(--safe-b) + 30px);max-width:460px;margin:0 auto}
.entrada .logo{width:76px;height:76px;margin-bottom:18px}
.entrada h1{font-size:40px;color:var(--ouro);line-height:1.05}
.entrada p{color:var(--cinza)}
.entrada input{width:100%;border:1px solid var(--linha);background:var(--grafite);border-radius:14px;padding:15px;font-size:17px;margin-top:10px}
.quem{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.quem button{border:1px solid var(--linha);background:var(--grafite);border-radius:14px;padding:14px;font-size:16px;font-weight:600}
.quem button[aria-pressed="true"]{border-color:var(--ouro);color:var(--ouro);background:rgba(228,167,60,.08)}
.carregando{opacity:.55;transition:opacity .2s}
</style>
</head>
<body>
<div id="raiz"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const API = 'https://script.google.com/macros/s/AKfycbwwsXhmrX7bmAaDIj0nTk8NUWSQuNEboqksdKFRZy8KjbhnumJcc4iewzm_Cn3IYIA6FA/exec';
const LS = { k: 'cr_chave', nome: 'cr_nome', resp: 'cr_resp', dados: 'cr_dados', pct: 'cr_so_pct' };
const DEMO = location.search.includes('demo');
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const MESL = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const nomeMes = (k, longo) => { const [a, m] = k.split('-').map(Number); return longo ? MESL[m - 1] : MES[m - 1] + '/' + String(a).slice(2); };
const dataBr = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
const pct = (v, d = 0) => v == null || !isFinite(v) ? '—' : (v < 0 ? '−' : '') + (Math.abs(v) * 100).toFixed(d).replace('.', ',') + '%';
const est = { d: null, per: null, tela: 'ciclo', busca: '', soPct: localStorage.getItem(LS.pct) === '1' };
// valores em reais respeitam o modo "Só %"
const brl = (v, dec = true) => { if (est.soPct) return 'R$ •••'; if (v == null || !isFinite(v)) return '—'; return (v < 0 ? '−' : '') + 'R$ ' + Math.abs(v).toLocaleString('pt-BR', { minimumFractionDigits: dec ? 2 : 0, maximumFractionDigits: dec ? 2 : 0 }); };
const brl0 = v => brl(v == null ? v : Math.round(v), false);
const ico = {
  ciclo: '<path d="M20 12a8 8 0 0 1-13.7 5.6M4 12a8 8 0 0 1 13.7-5.6"/><path d="M18 3v4h-4M6 21v-4h4"/>',
  mes: '<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  cartao: '<rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6.5 15h4"/>',
  trofeu: '<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"/>',
  mais: '<path d="M12 5v14M5 12h14"/>',
  olho: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  olhoX: '<path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.3 6.3C3.6 8.1 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 4.4-1"/>',
  sync: '<path d="M20 11a8 8 0 0 0-14.5-4.5M4 13a8 8 0 0 0 14.5 4.5"/><path d="M5 3v4h4M19 21v-4h-4"/>',
  sair: '<path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 17l-5-5 5-5M5 12h11"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
  alerta: '<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/>',
  okI: '<circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/>',
  negI: '<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  relogio: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
};
const svg = (n, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ico[n]}</svg>`;
const statusHtml = (c, t) => `<span class="status ${c}">${svg(c === 'ok' ? 'okI' : c === 'neg' ? 'negI' : 'alerta')}${esc(t)}</span>`;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); }
const chave = () => localStorage.getItem(LS.k) || '';

// ---------------- dados
async function buscar() {
  if (DEMO) return (await (await fetch('demo.json')).json()).dados;
  const r = await fetch(API + '?k=' + encodeURIComponent(chave()) + '&t=' + Date.now());
  const j = await r.json();
  if (!j.ok) throw new Error(j.erro === 'chave' ? 'chave' : j.erro || 'Falha ao ler a planilha');
  return j.dados;
}
async function carregar(manual) {
  const m = $('main'); if (m) m.classList.add('carregando');
  try {
    const d = await buscar(); est.d = d; try { localStorage.setItem(LS.dados, JSON.stringify(d)); } catch (x) {}
    if (!est.per || (est.per !== 'ano' && !d.meses.some(x => x.mes === est.per))) est.per = d.mesAtual;
    render(); if (manual) toast('Atualizado com a planilha');
  } catch (e) {
    if (e.message === 'chave') { sair(); return; }
    if (est.d) { render(); toast('Sem conexão: mostrando os últimos números'); } else login('Não deu para falar com a planilha agora. Verifique a internet.');
  } finally { const m2 = $('main'); if (m2) m2.classList.remove('carregando'); }
}
function sair() { [LS.k, LS.nome, LS.resp, LS.dados].forEach(k => localStorage.removeItem(k)); est.d = null; login(); }

// ---------------- login
function login(msg) {
  let quem = '';
  $('#raiz').innerHTML = `<section class="entrada">
    <img class="logo" src="icon-192.png" alt="">
    <h1>Ciclo da Riqueza</h1>
    <p>Para onde vai a receita de vocês: padrão de vida, investimento ou consumo.</p>
    <form id="fl" autocomplete="on">
      <div class="quem" role="group" aria-label="Quem está entrando">
        <button type="button" data-u="adna" aria-pressed="false">Adna</button><button type="button" data-u="gabriel" aria-pressed="false">Gabriel</button></div>
      <input id="usuario" name="username" autocomplete="username" type="text" hidden>
      <input id="senha" name="password" type="password" autocomplete="current-password" placeholder="Senha" aria-label="Senha" required>
      <button class="btn" type="submit" id="be">Entrar</button>
      <p class="erro" id="le">${msg ? esc(msg) : ''}</p></form></section>`;
  $('#fl').querySelectorAll('[data-u]').forEach(b => b.onclick = () => {
    quem = b.dataset.u; $('#usuario').value = quem;
    $('#fl').querySelectorAll('[data-u]').forEach(x => x.setAttribute('aria-pressed', x === b)); $('#senha').focus();
  });
  $('#fl').onsubmit = async e => {
    e.preventDefault();
    if (!quem) { $('#le').textContent = 'Escolha quem está entrando: Adna ou Gabriel.'; return; }
    const b = $('#be'); b.disabled = true; b.textContent = 'Entrando…'; $('#le').textContent = '';
    try {
      if (DEMO) { localStorage.setItem(LS.k, 'DEMO'); localStorage.setItem(LS.nome, quem === 'adna' ? 'Adna' : 'Gabriel'); localStorage.setItem(LS.resp, quem === 'adna' ? 'Ela' : 'Ele'); montar(); carregar(); return; }
      const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ acao: 'login', usuario: quem, senha: $('#senha').value }) });
      const j = await r.json(); if (!j.ok) throw new Error(j.erro || 'Não entrou');
      localStorage.setItem(LS.k, j.k); localStorage.setItem(LS.nome, j.nome); localStorage.setItem(LS.resp, j.resp);
      montar(); carregar();
    } catch (x) { $('#le').textContent = x.message || 'Sem conexão. Tente de novo.'; b.disabled = false; b.textContent = 'Entrar'; }
  };
}

    <nav class="abas" aria-label="Telas">

      <button class="aba" data-t="mes">${svg('mes')}Mês</button>

  $('#olho').onclick = () => { est.soPct = !est.soPct; localStorage.setItem(LS.pct, est.soPct ? '1' : '0'); render(); };
  $('#sync').onclick = () => carregar(true);
  $('#bsair').onclick = () => { if (confirmarSaida()) sair(); };
  $('#bmais').onclick = abrirLanc; $('#veu').onclick = fecharLanc;
}
function confirmarSaida() { return true; }
function irPara(t) { est.tela = t; if (t === 'cartoes' && est.per === 'ano') est.per = est.d.mesAtual; render(); scrollTo(0, 0); }

function render() {
  const d = est.d; if (!d) return; if (!$('#main')) montar();
  $('#ola').textContent = 'Olá, ' + (localStorage.getItem(LS.nome) || '') + ' · planilha às ' + d.geradoEm.slice(11, 16);
  $('#olho').innerHTML = (est.soPct ? svg('olhoX') : svg('olho')) + (est.soPct ? 'Só %' : 'R$');
  $('#olho').setAttribute('aria-pressed', est.soPct);
  $('#olho').setAttribute('aria-label', est.soPct ? 'Valores escondidos. Toque para mostrar em reais' : 'Toque para mostrar só porcentagens');
  const c = d.ciclo, anoOk = est.tela !== 'cartoes' && c;
  $('#per').innerHTML = (anoOk ? `<button class="per ano" data-p="ano" aria-pressed="${est.per === 'ano'}">${esc(c.acumulado.rotulo || 'Ano')}</button>` : '') +
    d.meses.map(m => `<button class="per ${m.mes > d.mesAtual ? 'fut' : ''}" data-p="${m.mes}" aria-pressed="${m.mes === est.per}">${nomeMes(m.mes)}</button>`).join('');
  $('#per').querySelectorAll('.per').forEach(b => b.onclick = () => { est.per = b.dataset.p; render(); });
  const at = $('#per [aria-pressed="true"]'); if (at) at.scrollIntoView({ inline: 'center', block: 'nearest' });
  document.querySelectorAll('.aba[data-t]').forEach(b => b.dataset.t === est.tela ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  const telas = { ciclo: telaCiclo, mes: telaMes, cartoes: telaCartoes, desafio: telaDesafio };
  $('#main').innerHTML = telas[est.tela]();
  if (est.tela === 'mes') { const b = $('#busca'); if (b) b.oninput = () => { est.busca = b.value; $('#lancs').innerHTML = listaLanc(); }; }
  const at2 = $('#atalho'); if (at2) at2.onclick = () => irPara('mes');
}

// ---------------- regras (iguais às da planilha)
const mesK = () => est.per === 'ano' ? est.d.mesAtual : est.per;
const mesDados = k => est.d.meses.find(m => m.mes === k);
function statusMes(m) {
  const min = est.d.invest.aporteMin;
  if (!m.rec && !m.desp) return { c: 'risco', t: 'Sem lançamentos neste mês' };
  if (m.sobra < 0) return { c: 'neg', t: 'Negativo: a despesa passou da receita' };
  if (m.aporte < min || (m.rec > 0 && m.desp / m.rec > 0.9)) return { c: 'risco', t: 'Em risco: sobra ou aporte abaixo da meta' };
  return { c: 'ok', t: 'Saudável: a receita cobre despesas e aporte' };
}
function porDia() {
  const d = est.d, m = mesDados(d.mesAtual); if (!m || !m.recPrev) return null;
  const [a, mm] = d.mesAtual.split('-').map(Number);
  const hoje = +d.geradoEm.slice(8, 10), fim = new Date(a, mm, 0).getDate(), dias = fim - hoje + 1;
  const livre = m.recPrev - d.invest.aporteMin - m.desp, v = livre / dias, ritmo = (m.recPrev - d.invest.aporteMin) / fim / 2;
  return { v, dias, c: v < 0 ? 'neg' : v < ritmo ? 'risco' : 'ok', t: v < 0 ? 'Já passou do que a receita permite neste mês' : v < ritmo ? 'Ritmo apertado: segurem as despesas' : 'Dentro do ritmo' };
}
function cicloPer() {
  const c = est.d.ciclo; if (!c) return null;
  if (est.per === 'ano') return Object.assign({ ano: true }, c.acumulado);
  return c.meses.find(m => m.mes === est.per) || c.meses[0];
}

// ---------------- TELA CICLO
function caixa(x, y, w, h, tipo, titulo, sub, p, v) {
  const cor = { ouro: '#E4A73C', rubi: '#D04A3F', neutro: '#9A9187', cheio: '#E4A73C' }[tipo], cheio = tipo === 'cheio';
  const txt = cheio ? '#0D0C0B' : '#F3EDE3', sb = cheio ? '#3A2A0E' : '#9A9187';
  const linha2 = v != null && !est.soPct ? brl0(v) : sub;
  return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${cheio ? cor : '#191613'}" stroke="${cor}" stroke-width="${cheio ? 0 : 1.6}"/>
    <text class="tt" x="${x + 14}" y="${y + 25}" fill="${txt}">${titulo}</text><text class="st" x="${x + 14}" y="${y + 45}" fill="${sb}">${esc(linha2)}</text>
    ${p != null ? `<text class="pv" x="${x + w - 12}" y="${y + 47}" text-anchor="end" fill="${cheio ? '#0D0C0B' : cor === '#9A9187' ? '#F3EDE3' : cor}">${p}</text>` : ''}</g>`;
}
const seta = (x1, y1, x2, y2, cor = '#E4A73C') => `<path d="M${x1} ${y1} L${x2} ${y2}" stroke="${cor}" stroke-width="1.6" fill="none" marker-end="url(#pt${cor === '#E4A73C' ? 'o' : 'c'})"/>`;
function diagrama(m) {
  const fut = m.receita == null, R = m.receita || 0, div = v => (R && v != null ? v / R : null);
  const wR = fut ? 0 : (m.pInvestido || 0), wC = fut ? 0 : (m.pEuMereco || 0);
  const sw = w => (1.6 + Math.min(1, w / 0.4) * 7).toFixed(1), op = w => (0.25 + Math.min(1, w / 0.3) * 0.75).toFixed(2);
  const W = 380, bx = 90, bw = 200;
  return `<svg class="diagrama" viewBox="0 0 ${W} 470" role="img" aria-label="O ciclo do dinheiro com a porcentagem de cada etapa">
    <defs><marker id="pto" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9z" fill="#E4A73C"/></marker>
      <marker id="ptc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9z" fill="#9A9187"/></marker>
      <marker id="ptr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9z" fill="#D04A3F"/></marker>
      <filter id="brilho" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.5"/></filter></defs>
    <g opacity="${op(wR)}"><path d="M16 314 H6 V38 H${bx - 4}" class="loop" stroke="#E4A73C" stroke-width="${sw(wR)}" filter="url(#brilho)" opacity=".6"/>
      <path class="loop desenha" d="M18 314 H8 V38 H${bx - 6}" stroke="#E4A73C" stroke-width="${sw(wR)}" marker-end="url(#pto)"/><path class="loop desenha" d="M18 424 H8 V314" stroke="#E4A73C" stroke-width="${sw(wR)}"/></g>
    <g opacity="${op(wC)}"><path d="M${W - 18} 424 H${W - 6} V124 H${bx + bw + 4}" class="loop" stroke="#D04A3F" stroke-width="${sw(wC)}" filter="url(#brilho)" opacity=".6"/>
      <path class="loop desenha" d="M${W - 18} 424 H${W - 8} V124 H${bx + bw + 6}" stroke="#D04A3F" stroke-width="${sw(wC)}" marker-end="url(#ptr)"/></g>
    ${seta(190, 66, 190, 94)}${seta(190, 152, 190, 180)}
    <path d="M190 238 V256 M100 256 H280" stroke="#E4A73C" stroke-width="1.6" fill="none"/>${seta(100, 256, 100, 282)}${seta(280, 256, 280, 282)}
    <path d="M280 344 V362 M100 362 H280" stroke="#9A9187" stroke-width="1.6" fill="none"/>${seta(100, 362, 100, 392, '#9A9187')}${seta(280, 362, 280, 392, '#9A9187')}
    ${caixa(bx, 8, bw, 58, 'cheio', 'RECEITA', 'trabalho + ativos', fut ? null : '100%', m.receita)}
    ${caixa(bx, 94, bw, 58, 'rubi', 'PADRÃO DE VIDA', 'custo mensal da vida', fut ? null : pct(m.pCusto), m.padrao)}
    ${caixa(bx, 180, bw, 58, 'ouro', 'RESULTADO', 'o que sobra', fut ? null : pct(m.pResultado), m.resultado)}
    ${caixa(18, 284, 168, 60, 'ouro', 'INVESTIMENTO', 'ativos', fut ? null : pct(div(m.investimento)), m.investimento)}
    ${caixa(196, 284, 166, 60, 'neutro', 'DÍVIDAS', 'uso do crédito', null, null)}
    ${caixa(18, 394, 168, 60, 'ouro', 'ALAVANCAGEM', 'crédito → ativo', fut ? null : pct(div(m.alavancagem)), m.alavancagem)}
    ${caixa(196, 394, 166, 60, 'rubi', 'EU MEREÇO', 'consumo', fut ? null : pct(m.pEuMereco), m.euMereco)}</svg>`;
}
function atalhoMes() {
  const d = est.d, k = mesK(), m = mesDados(k); if (!m) return '';
  const st = statusMes(m), pd = k === d.mesAtual ? porDia() : null, fut = k > d.mesAtual;
  const valor = est.soPct ? (m.rec ? pct(m.sobra / m.rec) + ' da receita' : '—') : brl(m.sobra);
  return `<button class="atalho" id="atalho" aria-label="Abrir o resumo completo do mês">
    <div class="lin"><div><div class="sub">${fut ? 'Sobra prevista em ' : 'Sobra de '}${nomeMes(k, true)}</div>
      <div class="grande num ${m.sobra < 0 ? 'neg' : ''}">${valor}</div></div><span class="seta">Ver mês ›</span></div>
    ${statusHtml(st.c, st.t)}
    ${pd ? `<div class="trio"><div><span>Cabe de despesa por dia</span><b class="${pd.c}">${brl(pd.v)}</b></div><div><span>Dias que faltam</span><b>${pd.dias}</b></div><div><span>Ritmo</span><b class="${pd.c}">${pd.c === 'ok' ? 'Dentro' : pd.c === 'risco' ? 'Apertado' : 'Estourou'}</b></div></div>` : ''}
  </button>`;
}
function telaCiclo() {
  const m = cicloPer(); if (!m) return '<p class="nota">A aba Ciclo da planilha ainda não está publicada.</p>';
  const fut = m.receita == null;
  if (fut) {
    const comp = m.comprometido || 0, prev = m.receitaPrevista || 0;

      ${prev ? ` ${pct(comp / prev)} da receita prevista já está comprometida com parcelas e contas a pagar${est.soPct ? '' : ` (${brl0(comp)} de ${brl0(prev)})`}.` : ''}</div></div>${atalhoMes()}`;
  }
  const pend = m.pendentes && m.pendentes.realizado ? m.pendentes.realizado : 0;
  const prevista = m.base === 'prevista' || (m.ano && est.d.ciclo.meses.some(x => x.base === 'prevista'));
  return `${diagrama(m)}
    <div class="legenda"><div class="r"><span>Ciclo da riqueza</span><b>${pct(m.pInvestido)}</b><span>volta como receita</span></div>
      <div class="c"><span>Ciclo do consumo</span><b>${pct(m.pEuMereco)}</b><span>vira padrão de vida</span></div></div>
    ${m.ano ? '' : atalhoMes()}
    ${prevista ? `<p class="nota">${m.ano ? 'O acumulado usa a receita prevista nos meses sem receita lançada.' : 'A receita deste mês é a prevista: nenhuma receita foi lançada como realizada ainda.'}</p>` : m.base === 'lançada + a receber' ? `<p class="nota">A receita do mês soma o que já entrou e os salários ainda a receber (previstos).</p>` : ''}
    ${(m.aClassificar || 0) > 0 ? `<div class="cartao aviso"><span class="ic">${svg('info')}</span><div><b>${pct(m.pClassificar)} da receita ainda sem ciclo.</b> ${pend ? pend + ' lançamentos' : 'Alguns lançamentos'} precisam de uma categoria do ciclo (coluna Ciclo da planilha).</div></div>` : ''}
    ${(m.pEuMereco || 0) > (m.pInvestido || 0) ? `<div class="cartao aviso alerta"><span class="ic">${svg('alerta')}</span><div><b>O eu mereço passou do investimento.</b> O consumo de hoje vira o padrão de vida de amanhã e come a receita do mês seguinte.</div></div>` : ''}
    <div class="grade">
      <div><span>Custo de vida</span><b>${pct(m.pCusto)}</b><small>${est.soPct ? 'da receita' : brl0(m.padrao)}</small></div>
      <div><span>Resultado</span><b>${pct(m.pResultado)}</b><small>${est.soPct ? 'da receita' : brl0(m.resultado)}</small></div>
      <div><span>Investido</span><b class="${(m.pInvestido || 0) >= est.d.ciclo.meta ? 'ok' : 'neg'}">${pct(m.pInvestido)}</b><small>meta ${pct(est.d.ciclo.meta)}</small></div>
      <div><span>Saldo livre</span><b class="${(m.pLivre || 0) < 0 ? 'neg' : ''}">${pct(m.pLivre)}</b><small>${est.soPct ? 'resultado sem destino' : brl0(m.saldoLivre)}</small></div></div>
    <p class="nota">Só entra o que já foi realizado. Compras no cartão contam no mês da fatura.</p>`;
}

// ---------------- TELA MÊS (o antigo painel)
function telaMes() {
  const d = est.d, k = mesK(), m = mesDados(k), fut = k > d.mesAtual, st = statusMes(m);
  const pd = k === d.mesAtual ? porDia() : null, cm = d.cartoes.meses.find(c => c.mes === k) || { inter: 0, nubank: 0 };
  const fx = d.fixas[k] || [], totFix = fx.reduce((s, f) => s + (f.pago || f.previsto), 0);
  const g = d.gastos[k] || {}, o = d.orc[k] || {}, mapa = d.listas.cicloPadrao || {};
  const cats = Array.from(new Set([...d.listas.despesa, ...Object.keys(g)])).map(c => ({ c, v: g[c] || 0, p: o[c] || 0 })).filter(x => x.v || x.p).sort((a, b) => b.v - a.v);
  const tot = cats.reduce((s, x) => s + x.v, 0), maxv = Math.max(...cats.map(x => Math.max(x.v, x.p)), 1);
  const R = m.rec || 0, p = v => R ? pct(v / R) : '—';
  return `<div class="cartao"><div class="sub">${fut ? 'Previsão de ' : ''}${nomeMes(k, true)}</div>
      <div class="grade" style="margin-top:8px">
        <div><span>Receita</span><b>${est.soPct ? '100%' : brl0(m.rec)}</b><small>${est.soPct ? 'base do mês' : 'prevista ' + brl0(m.recPrev)}</small></div>
        <div><span>Despesa</span><b class="${m.desp > m.rec ? 'neg' : ''}">${est.soPct ? p(m.desp) : brl0(m.desp)}</b><small>${est.soPct ? 'da receita' : 'prevista ' + brl0(m.despPrev)}</small></div>
        <div><span>Investido</span><b>${est.soPct ? p(m.aporte) : brl0(m.aporte)}</b><small>meta mínima ${est.soPct ? p(d.invest.aporteMin) : brl0(d.invest.aporteMin)}</small></div>
        <div><span>Sobra</span><b class="${st.c}">${est.soPct ? p(m.sobra) : brl0(m.sobra)}</b><small>${est.soPct ? 'da receita' : 'prevista ' + brl0(m.sobraPrev)}</small></div></div>
      <div style="margin-top:12px">${statusHtml(st.c, st.t)}</div></div>
    ${pd ? `<div class="cartao"><div class="sub">Cabe de despesa por dia até o fim do mês (${pd.dias} dias)</div><div class="num ${pd.c}" style="font-size:30px;font-weight:800;margin:4px 0">${brl(pd.v)}</div>${statusHtml(pd.c, pd.t)}</div>` : ''}
    ${receitasMes(k)}
    <div class="bloco-t"><h2>Faturas que vencem</h2><span class="sub num">${brl(cm.inter + cm.nubank)}</span></div>
    <div class="cartao" style="margin-top:10px"><ul class="lista">${linhaFatura('Inter', cm.inter, d.cartoes.venc.inter, d.cartoes.limites.inter, k)}${linhaFatura('Nubank', cm.nubank, d.cartoes.venc.nubank, d.cartoes.limites.nubank, k)}</ul></div>
    <div class="bloco-t"><h2>Contas fixas</h2><span class="sub num">${brl(totFix)}</span></div>
    <div class="cartao" style="margin-top:10px"><ul class="lista">${fx.map(f => {
      const pago = f.pago > 0, atras = !pago && k === d.mesAtual && f.dia && +d.geradoEm.slice(8, 10) > f.dia;
      return `<li><span class="marca ${pago ? 'ok' : atras ? 'neg' : ''}">${svg(pago ? 'check' : 'relogio')}</span>
        <span class="t"><b>${esc(f.nome)}</b><small>${pago ? 'Realizado em ' + dataBr(f.dataPgto) : atras ? 'A realizar · ainda não apareceu no banco (dia ' + f.dia + ')' : f.dia ? 'A realizar · vence por volta do dia ' + f.dia : 'A realizar · recarga quando precisar'}</small></span>
        <span class="v">${brl(pago ? f.pago : f.previsto)}${pago ? '' : '<small>previsto</small>'}</span></li>`; }).join('')}</ul></div>
    <div class="bloco-t"><h2>Despesas por categoria</h2><span class="sub num">${brl(tot)}</span></div>
    <div class="cartao" style="margin-top:10px">${cats.map(x => {
      const pp = x.p ? x.v / x.p * 100 : 0, cl = !x.p ? '' : pp > 100 ? 'neg' : pp > 85 ? 'risco' : 'ok', cic = mapa[x.c] || '';
      return `<div class="cat"><div class="cat-l"><b>${esc(x.c)}${cic ? `<span class="tag ${cic === 'Eu mereço' ? 'rubi' : cic === 'A classificar' ? '' : 'ouro'}">${esc(cic)}</span>` : ''}</b><span class="num">${est.soPct ? p(x.v) : brl(x.v)}</span></div>

  const p = m.pInvestido, tem = p != null, r = 46, circ = 2 * Math.PI * r, fr = tem ? Math.max(0, Math.min(1, p / Math.max(meta, 1e-4))) : 0;

  const ms = c.meses, W = 340, H = 180, top = 12, base = H - 26, x = i => 16 + i * ((W - 32) / (ms.length - 1));
  const vals = ms.flatMap(q => [q.pInvestido, q.pCusto]).filter(v => v != null), maxv = Math.max(meta * 1.5, ...vals, 0.2), y = v => base - (v / maxv) * (base - top);
  const linha = k => { let s = '', on = false; ms.forEach((q, i) => { if (q[k] == null) { on = false; return; } s += (on ? ' L' : ' M') + x(i).toFixed(1) + ' ' + y(q[k]).toFixed(1); on = true; }); return s; };
  const pts = (k, cor) => ms.map((q, i) => q[k] == null ? '' : `<circle cx="${x(i)}" cy="${y(q[k])}" r="4" fill="${cor}"/>`).join('');
  // sobra mês a mês (semáforo)
  const mm = d.meses, H2 = 160, mx = Math.max(...mm.map(q => Math.abs(q.sobra)), 1), zero = H2 * .62, e1 = (zero - 14) / mx, bw = W / mm.length;
  const sob = mm.map((q, i) => { const h = Math.abs(q.sobra) * e1, xx = i * bw + bw * .2, w = bw * .6, yy = q.sobra >= 0 ? zero - h : zero, st = statusMes(q).c;
    return `<rect x="${xx}" y="${yy}" width="${w}" height="${Math.max(h, 1)}" rx="3" fill="${st === 'neg' ? '#E5534B' : st === 'risco' ? '#F2C94C' : '#4FB37A'}" opacity="${q.mes > d.mesAtual ? .5 : 1}"/><text x="${xx + w / 2}" y="${H2 - 4}" text-anchor="middle">${MES[+q.mes.slice(5) - 1]}</text>`; }).join('');
  const pj = d.invest.projecao, pmax = Math.max(...pj.map(q => q.max), 1), PH = 150;
  const pt = k => pj.map((q, i) => `${(i / (pj.length - 1) * W).toFixed(1)},${(PH - 18 - q[k] / pmax * (PH - 30)).toFixed(1)}`).join(' ');
  return `<div class="cartao"><div class="destaque">

        ${fr > 0 ? `<circle cx="56" cy="56" r="${r}" fill="none" stroke="${fr >= 1 ? '#4FB37A' : fr >= .5 ? '#F2C94C' : '#E5534B'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(circ * fr).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90 56 56)"/>` : ''}
        <text x="56" y="62" text-anchor="middle" fill="#F3EDE3" style="font:800 20px Archivo,system-ui">${tem ? Math.round(fr * 100) + '%' : '—'}</text></svg>
      <div><div class="sub">${m.ano ? 'No ano, investido da receita' : 'Investido em ' + nomeMes(m.mes, true)}</div>
        <div class="grande ${fr >= 1 ? 'ok' : fr >= .5 ? 'risco' : 'neg'}">${pct(p, 1)}</div>
        <div class="sub">${!tem ? 'Sem receita realizada neste período.' : fr >= 1 ? 'Meta batida. Continue no ciclo da riqueza.' : `Faltam ${((meta - p) * 100).toFixed(1).replace('.', ',')} pontos para a meta de ${pct(meta)}.`}</div></div></div>
      <div class="metas" role="group" aria-label="Escolher a meta">${[0.1, 0.15, 0.2, 0.3].map(v => `<button data-m="${v}" aria-pressed="${Math.abs(v - meta) < 0.001}">Meta ${pct(v)}</button>`).join('')}</div></div>
    <div class="cartao"><h2>Sequência na meta</h2>
      <p class="sub" style="margin:4px 0 0">${atual ? `${atual} ${atual === 1 ? 'mês seguido' : 'meses seguidos'} investindo pelo menos ${pct(meta)} da receita.` : 'Nenhum mês na meta ainda. O primeiro selo vem com 3 meses seguidos.'}</p>
      <div class="selos">${[3, 6, 12].map(n => `<div class="selo ${seqMax >= n ? 'ganho' : ''}"><b>${n}</b>meses</div>`).join('')}</div></div>

function informativo(m) {
  if (m.pInvestido == null) return '<b>Como funciona.</b> A receita paga primeiro o padrão de vida. O que sobra é o resultado, e ele tem dois destinos: ativos ou consumo.';
  if ((m.pEuMereco || 0) > (m.pInvestido || 0)) return '<b>Eu mereço acima do investimento.</b> Cada real de consumo hoje tende a virar padrão de vida amanhã. Antes do próximo "eu mereço", separe a meta do mês para investir.';
  if ((m.pCusto || 0) > 0.7) return '<b>Custo de vida alto.</b> Quando o padrão de vida passa de 70% da receita, sobra pouco para decidir. Vale olhar as três maiores contas fixas.';
  return '<b>No ciclo da riqueza.</b> Investimento vira ativo, ativo vira receita nova. Subir a meta aos poucos acelera esse giro.';
}

function abrirLancManter() { const v = $('#lv').value, ds = $('#ld').value, f = $('#lf').value, t = $('#lt').value; novo.forma = f; abrirLanc(); $('#lv').value = v; $('#ld').value = ds; $('#lt').value = t; }

  const b = e.target.closest('.metas button'); if (!b) return;
  const v = +b.dataset.m;
  if (DEMO) { est.d.ciclo.meta = v; render(); toast('Meta alterada (demonstração)'); return; }
  b.disabled = true;
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ k: chave(), acao: 'meta', meta: v }) });
    const j = await r.json(); if (!j.ok) throw new Error(j.erro);
    toast('Meta salva na planilha: ' + pct(v)); carregar();
  } catch (x) { toast('Não salvou a meta: ' + (x.message || 'sem conexão')); b.disabled = false; }
});

(function iniciar() {
  try { est.d = JSON.parse(localStorage.getItem(LS.dados) || 'null'); } catch (x) { est.d = null; }
  if (!chave()) { login(); return; }
  if (est.d) { est.per = est.d.mesAtual; montar(); render(); }
  carregar();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
